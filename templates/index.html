<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Support Agent - Enterprise Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0066ff;
            --primary-dark: #0052cc;
            --primary-light: #e6f0ff;
            --secondary: #ff6b35;
            --success: #00d084;
            --warning: #ffa500;
            --danger: #ff3b30;
            --bg-dark: #0a0e27;
            --bg-light: #f5f7fa;
            --border: #e1e8ed;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-light: #999999;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            height: 700px;
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SIDEBAR */
        .sidebar {
            width: 320px;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1f3a 100%);
            padding: 32px 24px;
            overflow-y: auto;
            border-right: 1px solid var(--border);
        }

        .sidebar h2 {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            margin-bottom: 32px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .stat-unit {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 400;
        }

        .stat-change {
            font-size: 12px;
            color: var(--success);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* MAIN CONTENT */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-light);
        }

        /* HEADER */
        .header {
            background: white;
            padding: 24px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--primary-light);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--primary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* MESSAGES */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .messages::-webkit-scrollbar {
            width: 8px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 4px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #bbb;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            color: var(--text-light);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h2 {
            font-size: 18px;
            color: var(--text-primary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: var(--primary);
            color: white;
            border-radius: 16px 16px 4px 16px;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.25);
        }

        .message.agent .message-bubble {
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 16px 16px 16px 4px;
        }

        .message-meta {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 8px;
            padding: 0 16px;
        }

        .intent-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 8px;
        }

        .confidence {
            font-size: 11px;
            color: var(--text-light);
        }

        .escalation-badge {
            display: inline-block;
            background: #fff3cd;
            color: #856404;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }

        .auto-handle-badge {
            display: inline-block;
            background: #d4edda;
            color: #155724;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }

        .loading {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-light);
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            40% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        /* INPUT AREA */
        .input-area {
            padding: 20px 32px;
            background: white;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: white;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        input[type="text"]::placeholder {
            color: var(--text-light);
        }

        .send-btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.25);
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 102, 255, 0.35);
        }

        .send-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .sidebar {
                width: 280px;
            }

            .message-bubble {
                max-width: 75%;
            }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                max-height: 100vh;
            }

            .sidebar {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 12px;
                padding: 20px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .sidebar h2,
            .sidebar p {
                grid-column: 1 / -1;
            }

            .messages {
                height: 300px;
                padding: 16px;
            }

            .message-bubble {
                max-width: 85%;
            }

            .input-area {
                padding: 16px;
            }
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <h2>🤖 AI Agent</h2>
            <p>Enterprise Support Platform</p>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Messages</div>
                    <div class="stat-value">
                        <span id="total-messages">0</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Auto-Handled</div>
                    <div class="stat-value">
                        <span id="auto-handled">0</span>
                        <span class="stat-unit">%</span>
                    </div>
                    <div class="stat-change">↑ Efficiency</div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Escalated</div>
                    <div class="stat-value">
                        <span id="escalated">0</span>
                        <span class="stat-unit">%</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-label">Avg Confidence</div>
                    <div class="stat-value">
                        <span id="avg-confidence">0</span>
                        <span class="stat-unit">%</span>
                    </div>
                    <div class="stat-change">✓ High accuracy</div>
                </div>
            </div>
        </div>

        <!-- MAIN CHAT AREA -->
        <div class="main">
            <!-- HEADER -->
            <div class="header">
                <div>
                    <h1>Customer Support AI</h1>
                    <p class="header-subtitle">Powered by Advanced AI • Instant Responses</p>
                </div>
                <div class="status-badge">
                    <span class="status-dot"></span>
                    Live & Ready
                </div>
            </div>

            <!-- MESSAGES -->
            <div class="messages" id="messages">
                <div class="empty-state">
                    <div class="empty-state-icon">💬</div>
                    <h2>Start a Conversation</h2>
                    <p>Ask about orders, returns, billing, or technical support</p>
                </div>
            </div>

            <!-- INPUT -->
            <div class="input-area">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="message-input" 
                        placeholder="Type your message here... Try 'Where is my order?'"
                        autocomplete="off"
                    >
                </div>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">
                    <span>Send</span>
                    <span>→</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const inputField = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        let firstMessage = true;

        function updateStats() {
            fetch('/api/stats')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('total-messages').textContent = data.total_messages || 0;
                    
                    if (data.total_messages > 0) {
                        document.getElementById('auto-handled').textContent = data.auto_handle_rate || 0;
                        document.getElementById('escalated').textContent = data.escalation_rate || 0;
                        document.getElementById('avg-confidence').textContent = data.avg_confidence || 0;
                    }
                });
        }

        function sendMessage() {
            const message = inputField.value.trim();
            if (!message) return;

            if (firstMessage) {
                messagesDiv.innerHTML = '';
                firstMessage = false;
            }

            // User message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerHTML = `<div class="message-bubble">${escapeHtml(message)}</div>`;
            messagesDiv.appendChild(userDiv);

            inputField.value = '';
            inputField.disabled = true;
            sendBtn.disabled = true;

            // Loading state
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message agent';
            loadingDiv.innerHTML = '<div class="message-bubble"><div class="loading"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
            messagesDiv.appendChild(loadingDiv);

            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            // Send request
            fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            })
            .then(r => r.json())
            .then(data => {
                loadingDiv.remove();

                if (data.error) {
                    const errorDiv = document.createElement('div');
                    errorDiv.className = 'message agent';
                    errorDiv.innerHTML = `<div class="error-message">❌ ${escapeHtml(data.error)}</div>`;
                    messagesDiv.appendChild(errorDiv);
                } else {
                    const agentDiv = document.createElement('div');
                    agentDiv.className = 'message agent';
                    
                    let html = `<div class="message-bubble">${escapeHtml(data.reply)}</div>`;
                    html += `<div class="message-meta">`;
                    html += `<span class="intent-badge">${escapeHtml(data.intent)}</span>`;
                    html += `<span class="confidence">${data.confidence}% confident</span>`;
                    
                    if (data.escalate) {
                        html += `<span class="escalation-badge">⚠️ ESCALATE</span>`;
                    } else {
                        html += `<span class="auto-handle-badge">✓ AUTO-HANDLE</span>`;
                    }
                    
                    html += `</div>`;
                    agentDiv.innerHTML = html;
                    messagesDiv.appendChild(agentDiv);
                }

                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();

                updateStats();
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            })
            .catch(err => {
                loadingDiv.remove();
                const errorDiv = document.createElement('div');
                errorDiv.className = 'message agent';
                errorDiv.innerHTML = `<div class="error-message">❌ ${err.message}</div>`;
                messagesDiv.appendChild(errorDiv);
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        inputField.focus();
        updateStats();
    </script>
</body>
</html>
